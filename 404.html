    .cta{display:inline-flex;align-items:center;gap:14px;margin-top:36px;padding:8px 8px 8px 26px;border-radius:999px;background:var(--accent-fill);color:var(--on-fill);font-family:var(--font-display);font-weight:700;font-size:1.15rem;text-decoration:none;letter-spacing:-.01em;box-shadow:0 18px 40px -22px var(--accent-shadow);transition:translate .3s cubic-bezier(.2,.7,.2,1),box-shadow .3s}
    .cta svg{width:2.5rem;height:2.5rem;padding:.65rem;border-radius:50%;background:color-mix(in srgb,var(--on-fill) 16%,transparent);fill:none;stroke:var(--on-fill);stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}

    <h1>Le portfolio<br>a <span class="acc">déménagé.</span></h1>
    <p class="lead">Mon portfolio de développeur full-stack vit maintenant sur son propre domaine. Vous allez être redirigé automatiquement.</p>
    <a class="cta" id="go" href="https://liam-dev.fyi/">liam-dev.fyi
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
    </a>
    <p class="meta"><span class="ring" id="ring" aria-hidden="true"></span><span id="count" aria-live="polite">Redirection dans 5 s</span> <noscript>(JavaScript désactivé : utilisez le bouton)</noscript></p>
  </main>
  <script>
    (function () {
      var HOST = "https://liam-dev.fyi";
      /* Anciennes URLs (CV, liens) : /projects/x.html devient /projects/x, la racine reste la racine. */
      var path = location.pathname.replace(/index\.html$/, "").replace(/\.html$/, "");
      var known = /^\/(projects\/[a-z-]+|portfolio-apprentissage|mentions-legales)?$/;
      var dest = HOST + (known.test(path) ? path : "/");
      document.getElementById("go").href = dest;
      var meta = document.querySelector('meta[http-equiv="refresh"]');
      if (meta) meta.setAttribute("content", "8;url=" + dest);
      var total = 5, start = Date.now(), ring = document.getElementById("ring"), count = document.getElementById("count");
      var timer = setInterval(function () {
        var left = Math.max(0, total - (Date.now() - start) / 1000);
        ring.style.setProperty("--p", Math.round(100 - left / total * 100));
        count.textContent = "Redirection dans " + Math.ceil(left) + " s";
        if (left <= 0) { clearInterval(timer); location.replace(dest); }
      }, 100);
    })();
  </script>
